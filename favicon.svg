<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="innerShieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)"/>
  
  <!-- Comic Burst Rays -->
  <path d="M256 256 L60 40 L256 256 L452 40 L256 256 L472 256 L256 256 L452 472 L256 256 L60 472 L256 256 L40 256 Z" stroke="rgba(124, 58, 237, 0.25)" stroke-width="4" fill="none"/>

  <!-- Comic Panel Frame (Subtle) -->
  <rect x="36" y="36" width="440" height="440" rx="30" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="3" stroke-dasharray="12 6"/>

  <!-- Outer Hero Shield (Gold Bevel) -->
  <path d="M256 64 L416 112 C416 272 340 390 256 448 C172 390 96 272 96 112 Z" fill="url(#shieldGrad)" stroke="#1e1b4b" stroke-width="10" filter="url(#glow)"/>

  <!-- Inner Hero Shield (Purple Glass) -->
  <path d="M256 92 L388 132 C388 264 324 360 256 410 C188 360 124 264 124 132 Z" fill="url(#innerShieldGrad)" stroke="#fbbf24" stroke-width="4"/>

  <!-- Starburst Behind Vault Keyhole -->
  <path d="M256 160 L272 208 L320 208 L280 238 L296 286 L256 254 L216 286 L232 238 L192 208 L240 208 Z" fill="url(#cyanGlow)" opacity="0.9"/>

  <!-- Central Vault Dial & Lock -->
  <circle cx="256" cy="245" r="58" fill="#0f172a" stroke="#fbbf24" stroke-width="8"/>
  <circle cx="256" cy="245" r="42" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="8 4"/>

  <!-- Keyhole in Center -->
  <circle cx="256" cy="235" r="12" fill="#fbbf24"/>
  <path d="M248 238 L264 238 L268 268 L244 268 Z" fill="#fbbf24"/>

  <!-- Comic Action Sparkle -->
  <circle cx="360" cy="120" r="6" fill="#22d3ee"/>
  <circle cx="150" cy="380" r="5" fill="#fbbf24"/>
</svg>
