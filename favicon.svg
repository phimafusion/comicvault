<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519"/>
      <stop offset="50%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </linearGradient>
    <linearGradient id="goldLock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="crimsonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Crimson & Violet Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGradC)"/>

  <!-- Comic Book Spine & Cover Frame -->
  <rect x="72" y="80" width="368" height="352" rx="28" fill="url(#bookCover)" stroke="#fda4af" stroke-width="4" filter="url(#crimsonGlow)"/>

  <!-- Inner Comic Pages Layer -->
  <path d="M100 110 L412 110 L412 402 L100 402 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M112 122 L400 122 L400 390 L112 390 Z" fill="#0f172a"/>

  <!-- Glowing Vault Door in Center of Book -->
  <circle cx="256" cy="256" r="105" fill="url(#goldLock)" stroke="#1e1b4b" stroke-width="12"/>
  <circle cx="256" cy="256" r="78" fill="#111827" stroke="#fbbf24" stroke-width="6"/>

  <!-- Vault Dial Teeth / Markings -->
  <circle cx="256" cy="256" r="62" fill="none" stroke="url(#cyanSpark)" stroke-width="5" stroke-dasharray="12 6"/>

  <!-- Center Vault Keyhole & Handle -->
  <circle cx="256" cy="245" r="16" fill="url(#goldLock)"/>
  <path d="M245 248 L267 248 L273 285 L239 285 Z" fill="url(#goldLock)"/>

  <!-- Comic Star Sparkle Top Right -->
  <path d="M380 90 L386 106 L402 112 L386 118 L380 134 L374 118 L358 112 L374 106 Z" fill="#fef08a"/>
</svg>
